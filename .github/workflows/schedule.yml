name: Automatyczna Aktualizacja Rankingu co godzine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
    - name: Pobierz pliki z repozytorium
      uses: actions/checkout@v4
    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Instalacja potrzebnych bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy plotly openpyxl requests

    - name: Uruchomienie skryptu aktualizujacego
      env:
        SUPER_SECRET_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      run: python ranking_code.py
