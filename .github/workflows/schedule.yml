name: Automatyczna Aktualizacja Rankingu co godzine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
    - name: Pobierz pliki z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja potrzebnych bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy plotly openpyxl

    - name: Uruchomienie skryptu Pythona (Generowanie HTML)
      # Zauważ, że usunęliśmy sekcję "env:" z tokenami - nie są już potrzebne!
      run: python ranking_code.py

    - name: Publikacja pliku index.html do repozytorium
      run: |

        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        cp index.html /tmp/index_new.html
        
        git fetch origin main
        git reset --hard origin/main
        
        cp /tmp/index_new.html index.html
        
        git add index.html
        
        if git diff-index --quiet HEAD --; then
          echo "Brak nowych danych w Excelu - plik HTML jest identyczny. Pomijam aktualizację."
        else
          git commit -m "Automatyczna aktualizacja rankingu z danych Excela"
          git push origin main
          echo "🚀 SUKCES! Zmiany zostały bezkonfliktowo nadpisane w repozytorium!"
        fi
